version: '3.8'

services:
  # PostgreSQL Database Container (Flyway Managed)
  postgres:
    image: postgres:16-alpine
    container_name: sharepresent-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sharepresentdb
      POSTGRES_USER: sharepresent
      POSTGRES_PASSWORD: sharepresent_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharepresent -d sharepresentdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
